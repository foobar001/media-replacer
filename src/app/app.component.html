<div class="page">
  <header class="header">
    <h1>Media Replacer</h1>
  </header>

  <div class="replacers-list">
    @for (item of replacers | keyvalue; track item.key) {
      <app-replacer
        [id]="item.key | number"
        (onUpdateMeta)="updateReplacer($event)"
        (onRemoveReplacer)="removeReplacer(item.key)"
      ></app-replacer>
    } @empty {
      <div class="empty-state">Замен пока нет — добавьте первую ниже.</div>
    }
  </div>

  <div class="actions">
    <button class="btn btn--ghost" (click)="addReplacer()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Добавить замену
    </button>
    <button class="btn btn--primary" (click)="showReplacerCode()" [disabled]="!hasValidReplacers">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
      </svg>
      Показать код замены
    </button>
  </div>

  @if (isReplacerCodeModalVisible) {
    <div class="modal">
      <div class="modal__overlay" (click)="hideReplacerCode()"></div>
      <div class="modal__window">
        <div class="modal__header">
          <div class="modal__title">Код замены</div>
          <button class="btn btn--primary btn--small" (click)="copyCode()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Копировать
          </button>
          <button class="btn btn--icon" (click)="hideReplacerCode()" title="Закрыть" aria-label="Закрыть">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <div class="modal__body">
          <div class="modal__code" [appHighlight]="replacerCode" language="html"></div>
        </div>
      </div>
    </div>
  }

  @if (toast) {
    <div class="toast">{{ toast }}</div>
  }
</div>
